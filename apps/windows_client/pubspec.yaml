name: multitap_client
description: Multitap remote desktop client.
publish_to: none
version: 1.1.3+258

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  crypto: 3.0.7
  # Generated l10n code (lib/l10n, flutter gen-l10n) imports intl.
  intl: 0.20.3
  qr: 4.0.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  fake_async: 1.3.3
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # lib/l10n from l10n.yaml (flutter gen-l10n); the generated files are
  # committed so a copy of lib without l10n.yaml builds unchanged.
  generate: true
  uses-material-design: true
  assets:
    - assets/backgrounds/
    - assets/licenses/
    # SIL Open Font License 1.1 text shipped with the bundled Pretendard.
    - assets/fonts/Pretendard-LICENSE.txt
  # Pretendard 1.3.9 (orioncactus/pretendard, OFL 1.1), unmodified static OTFs.
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
