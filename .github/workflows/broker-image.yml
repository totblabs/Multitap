# Broker image for a published GitHub release (docs/releasing.md).
#
# Release vX.Y.Z (X.Y.Z = server/package.json) carries the files that
# `node tools/release/github-release-bundle.mjs stage` wrote on the release PC:
# multitap-release-input.json, the Windows client and Host installers with their
# .exe.json receipts, and the three Android APKs with their
# .apk.verification.json receipts. This job builds the download bundle from them
# with the repository's own bundle rules, builds the broker image for
# linux/amd64, starts it once, pushes ghcr.io/<owner>/multitap-broker:X.Y.Z (and
# :latest for the newest full release) with GITHUB_TOKEN, and attaches
# multitap-release-bundle-X.Y.Z.tar.gz and multitap-broker-image-X.Y.Z.json.
# No signing key is used here: the Docker update feed is signed afterwards on
# the release PC (tools/release/docker-feed.mjs) and attached by hand.
name: Broker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build again (vX.Y.Z)
        required: true
        type: string

permissions: {}

concurrency:
  group: broker-image-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write # read the release, attach the bundle and image metadata
      packages: write # push the image to ghcr.io
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Release tag
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})$ ]] || { echo "::error::Release tags are vX.Y.Z, not $TAG"; exit 1; }
          # Once the signed feed names an image digest, that version is final.
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          if grep -qx server-updates-docker.json <<<"$assets"; then echo "::error::$TAG already has its signed Docker feed; a released image is not rebuilt"; exit 1; fi
          owner=$(tr '[:upper:]' '[:lower:]' <<<"$GITHUB_REPOSITORY_OWNER")
          { echo "VERSION=${TAG#v}"; echo "IMAGE=ghcr.io/$owner/multitap-broker"; } >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Source matches the tag
        run: |
          [ "$(jq -r .version server/package.json)" = "$VERSION" ] || { echo "::error::server/package.json is not $VERSION"; exit 1; }
          grep -qF "MULTITAP_VERSION:-$VERSION}" compose.yaml || { echo "::error::compose.yaml does not default to $VERSION"; exit 1; }
          # Node of the image's own pinned base runs the repository's bundle tool.
          base=$(sed -n 's/^FROM \(node:[^ ]*@sha256:[a-f0-9]\{64\}\).*/\1/p' server/Dockerfile | head -n 1)
          [ -n "$base" ] || { echo "::error::no pinned base image in server/Dockerfile"; exit 1; }
          { echo "BASE=$base"; echo "REVISION=$(git rev-parse HEAD)"; } >> "$GITHUB_ENV"

      - name: Download bundle
        run: |
          mkdir "$RUNNER_TEMP/assets"
          gh release download "$TAG" --dir "$RUNNER_TEMP/assets" \
            --pattern multitap-release-input.json \
            --pattern 'Multitap-*-windows-x64.exe' --pattern 'Multitap-*-windows-x64.exe.json' \
            --pattern 'Multitap-*-android-*.apk' --pattern 'Multitap-*-android-*.apk.verification.json'
          rm -rf server/release-bundle
          docker run --rm --network none -u "$(id -u):$(id -g)" -v "$PWD:/w" -v "$RUNNER_TEMP/assets:/assets:ro" -w /w "$BASE" \
            node tools/release/github-release-bundle.mjs bundle /assets /w/server/release-bundle
          tar -C server/release-bundle -czf "$RUNNER_TEMP/multitap-release-bundle-$VERSION.tar.gz" --owner=0 --group=0 --numeric-owner --sort=name .

      - name: Build linux/amd64
        run: |
          docker build --platform linux/amd64 --build-arg "MULTITAP_VERSION=$VERSION" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$REVISION" \
            -t "$IMAGE:$VERSION" server

      - name: Start once
        run: |
          printf '%s\n' "MULTITAP_IMAGE=$IMAGE" "MULTITAP_VERSION=$VERSION" MULTITAP_PUBLIC_ORIGIN=https://multitap-ci.invalid \
            MULTITAP_PUBLISH_PORT=127.0.0.1:38480 MULTITAP_UDP_PUBLISH_PORT=127.0.0.1:38481 \
            MULTITAP_DATA_VOLUME=multitap-ci-data MULTITAP_DOCKER_UPDATE_FEED=off > "$RUNNER_TEMP/ci.env"
          ci() { docker compose -f compose.yaml -p multitap-ci --env-file "$RUNNER_TEMP/ci.env" "$@"; }
          ci up -d --pull never
          state=starting
          for _ in $(seq 90); do
            state=$(docker inspect -f '{{.State.Health.Status}}' "$(ci ps -q broker)")
            [ "$state" = starting ] || break
            sleep 2
          done
          [ "$state" = healthy ] || ci logs --no-color broker | grep -v initial_setup_code || true
          ci down -v
          [ "$state" = healthy ] || { echo "::error::the image did not become healthy ($state)"; exit 1; }

      - name: Push
        run: |
          docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$GH_TOKEN"
          docker push "$IMAGE:$VERSION"
          # :latest only for the newest full release (a prerelease or a rebuilt older tag keeps it).
          newest=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1000 --json tagName --jq '.[].tagName' | sed -n 's/^v\([0-9]*\.[0-9]*\.[0-9]*\)$/\1/p' | sort -V | tail -n 1)
          if [ "$newest" = "$VERSION" ]; then docker tag "$IMAGE:$VERSION" "$IMAGE:latest"; docker push "$IMAGE:latest"; fi
          # The metadata tools/release/docker-feed.mjs signs (server/update/docker.mjs validateDockerImage).
          digest=$(docker image inspect "$IMAGE:$VERSION" | jq -r --arg prefix "$IMAGE@sha256:" '[.[0].RepoDigests[] | select(startswith($prefix))] | if length == 1 then .[0] else empty end')
          [ -n "$digest" ] || { echo "::error::no single pushed digest for $IMAGE:$VERSION"; exit 1; }
          jq -n --arg version "$VERSION" --arg image "$digest" --argjson bytes "$(docker image inspect -f '{{.Size}}' "$IMAGE:$VERSION")" \
            '{schema: 1, product: "multitap-broker", version: $version, image: $image, platform: "linux/amd64", imageBytes: $bytes}' \
            > "$RUNNER_TEMP/multitap-broker-image-$VERSION.json"
          { echo "Pushed \`$digest\`"; [ "$newest" = "$VERSION" ] && echo "and \`$IMAGE:latest\`."; echo; echo "Next: sign server-updates-docker.json on the release PC and attach it (docs/releasing.md)."; } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach to the release
        run: gh release upload "$TAG" --clobber "$RUNNER_TEMP/multitap-release-bundle-$VERSION.tar.gz" "$RUNNER_TEMP/multitap-broker-image-$VERSION.json"

      - name: Log out of ghcr.io
        if: always()
        run: docker logout ghcr.io
