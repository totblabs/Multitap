# Multitap broker (docs/docker-deployment.md).
#   Published image:   docker compose up -d
#   Build from source: docker compose -f compose.yaml -f compose.build.yaml up -d --build
# Settings live in .env (copy .env.example). Data, downloads and the vault stay
# in the broker-data volume across image updates.
name: multitap

services:
  broker:
    # MULTITAP_VERSION is the release to run; the admin console's server update
    # page shows the exact commands when a newer signed release exists.
    image: ${MULTITAP_IMAGE:-ghcr.io/totblabs/multitap-broker}:${MULTITAP_VERSION:-1.1.1}
    user: "1000:1000"
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MULTITAP_HOST: 0.0.0.0
      MULTITAP_PORT: "18480"
      MULTITAP_DATA_DIR: /var/lib/multitap
      MULTITAP_DEPLOYMENT_KIND: docker
      # The server's days (모니터링: 오늘, the day charts and lists) follow this
      # time zone. A container runs in UTC unless told: install.sh writes the
      # machine's own zone into .env, or set TZ there (an IANA name such as
      # Europe/Berlin).
      TZ: ${TZ:-UTC}
      MULTITAP_PUBLIC_ORIGIN: ${MULTITAP_PUBLIC_ORIGIN:-}
      # Plain HTTP for the LAN, alone or beside HTTPS (same listener).
      MULTITAP_HTTP_ORIGIN: ${MULTITAP_HTTP_ORIGIN:-}
      MULTITAP_ALLOW_INSECURE_HTTP: ${MULTITAP_ALLOW_INSECURE_HTTP:-0}
      # First setup by IP: http://<server address>:<published port> while no
      # address above is set. The container cannot see the server's own IP.
      MULTITAP_SERVER_ADDRESS: ${MULTITAP_SERVER_ADDRESS:-}
      MULTITAP_PUBLISHED_PORT: ${MULTITAP_PUBLISH_PORT:-18480}
      MULTITAP_TLS_MODE: proxy
      MULTITAP_TRUSTED_PROXIES: ${MULTITAP_TRUSTED_PROXIES:-}
      MULTITAP_DOCKER_UPDATE_FEED: ${MULTITAP_DOCKER_UPDATE_FEED:-}
      # UDP media relay on 18481 like the native install. Sessions use it once
      # both relay lists name the public address and the port is open.
      MULTITAP_UDP_PORT: ${MULTITAP_UDP_PORT:-18481}
      MULTITAP_UDP_MEDIA: ${MULTITAP_UDP_MEDIA:-}
      MULTITAP_STUN_SERVERS: ${MULTITAP_STUN_SERVERS:-}
      MULTITAP_UDP_HOST_RELAYS: ${MULTITAP_UDP_HOST_RELAYS:-}
      MULTITAP_UDP_CLIENT_RELAYS: ${MULTITAP_UDP_CLIENT_RELAYS:-}
      MULTITAP_HOST_ROUTE: ${MULTITAP_HOST_ROUTE:-}
    ports:
      - "${MULTITAP_PUBLISH_PORT:-18480}:18480"
      - "${MULTITAP_UDP_PUBLISH_PORT:-18481}:${MULTITAP_UDP_PORT:-18481}/udp"
    volumes:
      - broker-data:/var/lib/multitap
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16777216,uid=1000,gid=1000,mode=1770
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  broker-data:
    name: ${MULTITAP_DATA_VOLUME:-multitap-broker-data}
